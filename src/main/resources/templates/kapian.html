<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <title>Flexbox卡片布局</title>
    <style>
        body {
            line-height: 1.6;
            color: #333;
            background-color: #f5f7fa;
        }

        .container {
            margin: 0 auto;
            box-sizing: border-box;
        }

        .cards-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card-out{
            width: 20%;
        }

        .card {
            background-color: white;
            border-radius: 8px;
            border: 1px solid black;
            overflow: hidden;
            margin: 20px;
        }

        .card-title {
            background-color: #3498db;
            color: white;
            padding: 15px 20px;
            font-size: large;
        }

        .card-content {
            padding: 20px;
        }

        .card-content p {
            margin-bottom: 15px;
        }

        #test{
            border: 1px solid black;
            background: #bee0ea;
            width: 50%;
            margin: 0 auto;
            text-align: center;
        }
    </style>
</head>
